<!DOCTYPE html>
<html lang="ko">
<head>
<title>음악&영상</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<style>
  .music-box {
    margin: 20px 0;
    padding: 15px;
    background: #f4f4f4;
    border-radius: 8px;
    display: inline-block;
  }
  .music-btn {
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    border-radius: 4px;
    cursor: pointer;
    margin-right: 5px;
  }
  .music-btn:hover {
    background-color: #45a049;
  }
  .volume-control {
    margin-top: 12px;
    font-size: 14px;
  }
  .progress-control {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #555;
  }
  #progressBar {
    flex: 1;
    min-width: 200px;
    cursor: pointer;
    accent-color: #4CAF50;
  }
  #progressBar:disabled {
    cursor: default;
  }
  .time {
    font-variant-numeric: tabular-nums;
    min-width: 38px;
  }
  #trackList {
    list-style: none;
    margin: 14px 0 0;
    padding: 0;
    max-height: 100%;
    overflow-y: auto;
    border-top: 1px solid #ddd;
  }
  #trackList li {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 8px 6px;
    font-size: 14px;
    border-bottom: 1px solid #e6e6e6;
    cursor: pointer;
  }
  #trackList li:hover {
    background: #e9f5ea;
  }
  #trackList li:focus-visible {
    outline: 2px solid #4CAF50;
    outline-offset: -2px;
  }
  #trackList li .num {
    color: #888;
    min-width: 20px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  #trackList li.active {
    background: #dff0e0;
    font-weight: bold;
    color: #2e7d32;
  }
  #trackList li.failed {
    color: #b00020;
  }
  #trackInfo {
    margin-top: 10px;
    font-size: 14px;
    color: #333;
  }
</style>
</head>
<body>

<h2>음악&영상</h2>

<div class="music-box">
  <audio id="audioPlayer" preload="none"></audio>

  <div>
    <button class="music-btn" id="playBtn" onclick="togglePlay()">▶ 재생</button>
    <button class="music-btn" onclick="nextTrack()">⏭ 다음 곡</button>
  </div>

  <div class="progress-control">
    <span class="time" id="currentTime">0:00</span>
    <input type="range" id="progressBar" min="0" max="0" step="0.1" value="0" disabled>
    <span class="time" id="duration">0:00</span>
  </div>

  <div class="volume-control">
    🔊 볼륨: <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
  </div>

  <div id="trackInfo">음악 준비 중...</div>

  <ul id="trackList" aria-label="재생 목록"></ul>
</div>

<script>
  // blob 주소는 GitHub "웹페이지"라서 재생이 안 됩니다. raw 주소를 써야 합니다.
  const BASE_URL = "https://raw.githubusercontent.com/Byeong-Rae/music/main/";

  // 저장소에 있는 파일 이름을 그대로 적으세요 (대소문자, 공백, 특수문자까지 동일하게)
  const files = [
    "ABBA-TheWinneTakesItAll.mp3",
    "C_ine Dion - The Power Of Love (Official Remastered HD Video).mp3",
    "One Summer Night.mp3",
    "I Will Always Love You.mp3",
    "Fire Inc. - Nowhere Fast (Official Video) Remastered Audio HD.mp3",
    "롤러장 리게이라 여름은 지나가고.mp3",
    "롤러장 New Baccara - Fantasy Boy (1988).mp3",
    "Bonnie Tyler - Total Eclipse of the Heart (Turn Around) (Official Video).mp3",
    "진추하 - One Summer Night.mp3",
    "Air Supply - Making Love Out Of Nothing At All (Official HD Video).mp3",
    "Europe-TheFinalCountdown.mp3",
    "OPUS-LiveisLife.mp3",
    "StevieWonder-PartTimeLover.mp3"
  ];

  // 파일 이름 → { title, url } 객체로 변환 (공백·한글은 URL 인코딩)
  const playlist = files.map(name => ({
    title: name.replace(/\.mp3$/i, ""),
    url: BASE_URL + encodeURIComponent(name)
  }));

  let currentTrack = 0;
  let player, playBtn, trackInfo, volumeSlider;
  let progressBar, currentTimeEl, durationEl;
  let isSeeking = false; // 사용자가 바를 드래그하는 중인지
  let trackListEl;

  // 재생 목록 그리기
  function renderTrackList() {
    trackListEl.innerHTML = "";
    playlist.forEach((track, i) => {
      const li = document.createElement("li");
      li.tabIndex = 0; // 키보드로도 선택 가능
      li.innerHTML = `<span class="num">${i + 1}</span><span class="title"></span>`;
      li.querySelector(".title").textContent = track.title;
      li.addEventListener("click", () => selectTrack(i));
      li.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          selectTrack(i);
        }
      });
      trackListEl.appendChild(li);
    });
  }

  // 목록에서 곡을 눌렀을 때: 지금 곡이면 재생/일시정지, 다른 곡이면 그 곡 재생
  function selectTrack(index) {
    if (index === currentTrack && player.src) {
      togglePlay();
    } else {
      loadAndPlay(index);
    }
  }

  // 현재 곡 강조 표시
  function highlightCurrent() {
    [...trackListEl.children].forEach((li, i) => {
      li.classList.toggle("active", i === currentTrack);
      li.setAttribute("aria-current", i === currentTrack ? "true" : "false");
    });
    const active = trackListEl.children[currentTrack];
    if (active) active.scrollIntoView({ block: "nearest" });
  }

  // 초 → "m:ss" 형식
  function formatTime(sec) {
    if (!isFinite(sec) || sec < 0) return "0:00";
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return `${m}:${s.toString().padStart(2, "0")}`;
  }

  function resetProgress() {
    progressBar.max = 0;
    progressBar.value = 0;
    progressBar.disabled = true;
    currentTimeEl.innerText = "0:00";
    durationEl.innerText = "0:00";
  }

  window.addEventListener("DOMContentLoaded", () => {
    player = document.getElementById("audioPlayer");
    playBtn = document.getElementById("playBtn");
    trackInfo = document.getElementById("trackInfo");
    volumeSlider = document.getElementById("volumeSlider");
    progressBar = document.getElementById("progressBar");
    currentTimeEl = document.getElementById("currentTime");
    durationEl = document.getElementById("duration");
    trackListEl = document.getElementById("trackList");
    renderTrackList();

    // 곡 길이를 알게 되면 바의 최대값 설정
    player.addEventListener("loadedmetadata", () => {
      progressBar.max = player.duration;
      progressBar.disabled = false;
      durationEl.innerText = formatTime(player.duration);
    });

    // 재생 중 현재 위치 반영 (드래그 중에는 건드리지 않음)
    player.addEventListener("timeupdate", () => {
      if (isSeeking) return;
      progressBar.value = player.currentTime;
      currentTimeEl.innerText = formatTime(player.currentTime);
    });

    // 드래그하는 동안은 시간 표시만 미리 보여주기
    progressBar.addEventListener("input", () => {
      isSeeking = true;
      currentTimeEl.innerText = formatTime(progressBar.value);
    });

    // 손을 떼면 그 위치로 이동
    progressBar.addEventListener("change", () => {
      player.currentTime = progressBar.value;
      isSeeking = false;
    });

    // 곡이 끝나면 다음 곡
    player.addEventListener("ended", nextTrack);

    // 파일을 못 불러왔을 때 원인을 화면에 표시
    player.addEventListener("error", () => {
      trackInfo.innerText = `불러오기 실패: ${playlist[currentTrack].title} (파일 이름이나 주소를 확인하세요)`;
      playBtn.innerText = "▶ 재생";
      const li = trackListEl.children[currentTrack];
      if (li) li.classList.add("failed");
    });

    loadAndPlay(0);
  });

  function showPlaying() {
    playBtn.innerText = "⏸ 일시정지";
    trackInfo.innerText = `재생 중 (${currentTrack + 1}/${playlist.length}): ${playlist[currentTrack].title}`;
  }

  function loadAndPlay(index) {
    currentTrack = index;
    resetProgress();
    highlightCurrent();
    player.src = playlist[currentTrack].url;
    player.volume = volumeSlider.value;

    player.play().then(showPlaying).catch(error => {
      console.log("자동 재생 차단 또는 로드 실패:", error);
      playBtn.innerText = "▶ 재생";
      if (error.name === "NotAllowedError") {
        trackInfo.innerText = "자동 재생이 차단되었습니다. [재생] 버튼을 눌러주세요.";
      }
    });
  }

  function togglePlay() {
    if (player.paused) {
      if (!player.src) {
        loadAndPlay(currentTrack);
      } else {
        player.play().then(showPlaying).catch(err => console.log(err));
      }
    } else {
      player.pause();
      playBtn.innerText = "▶ 재생";
      trackInfo.innerText = "일시정지됨";
    }
  }

  function nextTrack() {
    loadAndPlay((currentTrack + 1) % playlist.length);
  }

  function changeVolume(value) {
    player.volume = value;
  }
</script>

</body>
</html>
