<!DOCTYPE html>
<html lang="KR">
<head>
<title>음악&영상</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<style>
  .music-box {
    margin: 20px 0;
    padding: 15px;
    background: #f4f4f4;
    border-radius: 8px;
    display: inline-block;
  }
  .music-btn {
    background-color: #4CAF50;
    color: white;
    border: none;
    padding: 10px 20px;
    font-size: 16px;
    border-radius: 4px;
    cursor: pointer;
    margin-right: 5px;
  }
  .music-btn:hover {
    background-color: #45a049;
  }
  .volume-control {
    margin-top: 12px;
    font-size: 14px;
  }
  #trackInfo {
    margin-top: 10px;
    font-size: 14px;
    color: #333;
  }
</style>
</head>
<body>

<h2>음악&영상</h2>

<img src="https://github.com/Byeong-Rae/image-/blob/main/기타2.png?raw=true"><br><h2>기타2</h2><br><br>

<!-- 커스텀 재생 영역 -->
<div class="music-box">
  <audio id="audioPlayer"></audio>
  
  <div>
    <button class="music-btn" id="playBtn" onclick="togglePlay()">▶ 재생</button>
    <button class="music-btn" onclick="nextTrack()">⏭ 다음 곡</button>
  </div>

  <div class="volume-control">
    🔊 볼륨: <input type="range" id="volumeSlider" min="0" max="1" step="0.05" value="1" oninput="changeVolume(this.value)">
  </div>
  
  <div id="trackInfo">음악 준비 중...</div>
</div>

<script>
  const playlist = [
    "https://github.com/Byeong-Rae/music/blob/main/ABBA-TheWinneTakesItAll.mp3",
    "https://github.com/Byeong-Rae/music/blob/main/C_ine Dion - The Power Of Love (Official Remastered HD Video).mp3",
    "https://github.com/Byeong-Rae/music/blob/main/One Summer Night.mp3",
    "https://github.com/Byeong-Rae/music/blob/main/I Will Always Love You.mp3",
    "https://github.com/Byeong-Rae/music/blob/main/Fire Inc. - Nowhere Fast (Official Video) Remastered Audio HD.mp3",
    "https://github.com/Byeong-Rae/music/blob/main/롤러장 리게이라 여름은 지나가고.mp3",
    "https://github.com/Byeong-Rae/music/blob/main/롤러장 New Baccara - Fantasy Boy (1988).mp3",
    "https://github.com/Byeong-Rae/music/blob/main/Bonnie Tyler - Total Eclipse of the Heart (Turn Around) (Official Video).mp3",
    "https://github.com/Byeong-Rae/music/blob/main/진추하 - One Summer Night.mp3",
    "https://github.com/Byeong-Rae/music/blob/main/Air Supply - Making Love Out Of Nothing At All (Official HD Video).mp3"
  ];

  let currentTrack = 0;
  let player, playBtn, trackInfo, volumeSlider;

  // HTML 요소들이 완전히 로드된 안전한 시점에 변수 연결
  window.addEventListener("DOMContentLoaded", () => {
    player = document.getElementById("audioPlayer");
    playBtn = document.getElementById("playBtn");
    trackInfo = document.getElementById("trackInfo");
    volumeSlider = document.getElementById("volumeSlider");

    if (player) {
      loadAndPlay(0);
    } else {
      console.error("audioPlayer 요소를 찾을 수 없습니다.");
    }
  });

  function loadAndPlay(index) {
    if (!player) return;
    currentTrack = index;
    player.src = playlist[currentTrack].url;
    player.load();
    
    if (volumeSlider) {
      player.volume = volumeSlider.value;
    }

    player.play().then(() => {
      if (playBtn) playBtn.innerText = "⏸ 일시정지";
      if (trackInfo) trackInfo.innerText = `재생 중 (${currentTrack + 1}/10): ${playlist[currentTrack].title}`;
    }).catch(error => {
      console.log("자동 재생 차단 또는 로드 실패:", error);
      if (playBtn) playBtn.innerText = "▶ 재생";
      if (trackInfo) trackInfo.innerText = "자동 재생이 차단되었습니다. [재생] 버튼을 눌러주세요.";
    });
  }

  function togglePlay() {
    if (!player) return;
    if (player.paused) {
      if (!player.src) {
        loadAndPlay(currentTrack);
      } else {
        player.play().then(() => {
          if (playBtn) playBtn.innerText = "⏸ 일시정지";
          if (trackInfo) trackInfo.innerText = `재생 중 (${currentTrack + 1}/10): ${playlist[currentTrack].title}`;
        }).catch(err => console.log(err));
      }
    } else {
      player.pause();
      if (playBtn) playBtn.innerText = "▶ 재생";
      if (trackInfo) trackInfo.innerText = "일시정지됨";
    }
  }

  function nextTrack() {
    currentTrack = (currentTrack + 1) % playlist.length;
    loadAndPlay(currentTrack);
  }

  function changeVolume(value) {
    if (player) {
      player.volume = value;
    }
  }

  // 브라우저에 요소가 준비된 이후에 onended 등록을 위해 DOMContentLoaded 내부에서 처리되도록 유도
  document.addEventListener("DOMContentLoaded", () => {
    const audioEl = document.getElementById("audioPlayer");
    if (audioEl) {
      audioEl.onended = function() {
        nextTrack();
      };
    }
  });
</script>

</body>
</html>
