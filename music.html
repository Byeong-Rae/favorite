<!DOCTYPE html>
<html lang="KR">
<head>
<title>음악&영상</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<audio id="audioPlayer" controls></audio>
<script>
  const playlist = [
    "https://github.com/Byeong-Rae/music/blob/main/ABBA - The Winner Takes It All (1980).mp3",
    "https://github.com/Byeong-Rae/music/blob/main/C_ine Dion - The Power Of Love (Official Remastered HD Video).mp3",
    "https://github.com/Byeong-Rae/music/blob/main/One Summer Night.mp3",
    "https://github.com/Byeong-Rae/music/blob/main/I Will Always Love You.mp3",
    "https://github.com/Byeong-Rae/music/blob/main/Fire Inc. - Nowhere Fast (Official Video) Remastered Audio HD.mp3",
    "https://github.com/Byeong-Rae/music/blob/main/롤러장 리게이라 여름은 지나가고.mp3",
    "https://github.com/Byeong-Rae/music/blob/main/롤러장 New Baccara - Fantasy Boy (1988).mp3",
    "https://github.com/Byeong-Rae/music/blob/main/Bonnie Tyler - Total Eclipse of the Heart (Turn Around) (Official Video).mp3",
    "https://github.com/Byeong-Rae/music/blob/main/진추하 - One Summer Night.mp3",
    https://github.com/Byeong-Rae/music/blob/main/"Air Supply - Making Love Out Of Nothing At All (Official HD Video).mp3"
  ];
  let currentTrack = 0;
  const player = document.getElementById("audioPlayer");
  
  function playTrack(index) {
    player.src = playlist[index];
    player.load();
    player.play();
  }
  
  player.onended = function() {
    currentTrack = (currentTrack + 1) % playlist.length;
    playTrack(currentTrack);
  };
  
  // 첫 곡 자동 재생 시작
  playTrack(0);
</script>
<body>

<h2>음악&영상</h2>

<img src="https://github.com/Byeong-Rae/image-/blob/main/기타2.png?raw=true"><br><h2>기타2</h2><br><br>
<audio controls src="여기에_복사한_Raw_URL을_붙여넣으세요"></audio>
  
</body>
</html>
